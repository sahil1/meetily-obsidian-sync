name: Build

on:
  push:
    branches: [main, sandbox]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc -noEmit -skipLibCheck
      - run: node esbuild.config.mjs production
